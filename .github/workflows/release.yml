name: Release

# On every push to master that touches the build's inputs: build everything,
# and if the data differs from every earlier release, attach the build to a
# new GitHub release and deploy it to the new server's CDN (/static/emoji/)
# through the restricted githubci account, the same way the client, add-ons
# and locale builds deploy. Generated files never live in git; shipped.json
# (committed) records what shipped, and the release holds everything else.
#
# Releases are named after the data's hash (build-<first 12 hex digits of
# sha256(v3.3.json)>), so a push that doesn't change the data releases and
# deploys nothing. Running the workflow by hand always deploys.
#
# The deploy key lives only in the deploy job, which never installs packages
# or runs repository code: it downloads the packaged build and pipes it to
# ffz-ci. Secrets: FFZ_DEPLOY_HOST, FFZ_DEPLOY_KEY, FFZ_DEPLOY_KNOWN_HOSTS.

on:
  push:
    branches: [master]
    paths:
      - shipped.json
      - sources.json
      - allow.json
      - package.json
      - pnpm-lock.yaml
      - src/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      created: ${{ steps.release.outputs.created }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache upstream sources
        uses: actions/cache@v6
        with:
          path: .cache
          key: emoji-sources-${{ hashFiles('sources.json', 'pnpm-lock.yaml', 'src/tools.ts') }}
          restore-keys: emoji-sources-

      - run: pnpm tools
      - run: pnpm sources
      - run: pnpm data
      - name: shipped.json matches the build
        run: |
          if [ -n "$(git status --porcelain -- shipped.json)" ]; then
            git diff --stat -- shipped.json
            echo "::error::shipped.json on master doesn't match the build."
            exit 1
          fi
      - run: pnpm images
      - run: pnpm check --baseline "${{ github.event.before || 'HEAD~1' }}"

      - name: Package
        id: package
        run: |
          version=$(sha256sum dist/v3.3.json | cut -c1-12)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tar -C dist -czf "emoji-$version.tar.gz" v3.3.json build.json images
          sha256sum "emoji-$version.tar.gz" dist/v3.3.json dist/emoji.json dist/manifest.json > SHA256SUMS

      - name: Create release
        id: release
        run: |
          tag="build-${{ steps.package.outputs.version }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists: the data hasn't changed."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "$tag" \
            --target "${{ github.sha }}" \
            --title "Emoji build ${{ steps.package.outputs.version }}" \
            --notes-file dist/report.md \
            "emoji-${{ steps.package.outputs.version }}.tar.gz" \
            dist/v3.3.json dist/emoji.json dist/manifest.json SHA256SUMS
          echo "created=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: steps.release.outputs.created == 'true' || github.event_name == 'workflow_dispatch'
        with:
          name: emoji
          path: emoji-${{ steps.package.outputs.version }}.tar.gz
          compression-level: 0    # already gzipped
          retention-days: 7

  deploy-new-server:
    needs: release
    if: needs.release.outputs.created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: deploy-new-server
      cancel-in-progress: false
    permissions: {}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: emoji
          path: build

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.FFZ_DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.FFZ_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.FFZ_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/ffz_deploy
          chmod 600 ~/.ssh/ffz_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/ffz_deploy -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "githubci@$DEPLOY_HOST" deploy emoji < build/emoji-*.tar.gz
